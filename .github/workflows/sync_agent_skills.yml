name: Sync agent skills

# Keeps packages/powersync/skills/ in sync with the latest release of
# https://github.com/powersync-ja/agent-skills by opening a PR when it changes.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: agent-skills release tag to sync (defaults to the latest release)
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push the sync branch
      pull-requests: write # Needed to open the PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync skill from agent-skills release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: tool/sync_skills.sh "$TAG"
      - name: Read synced release tag
        id: synced
        run: |
          tag=$(sed -n 's#^Source release: .*/releases/tag/\(v[^ )]*\).*#\1#p' packages/powersync/skills/README.md)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger CI. Set the
          # AGENT_SKILLS_SYNC_TOKEN secret (fine-grained PAT with contents and
          # pull-requests write access) to have check.yml run on the sync PR.
          token: ${{ secrets.AGENT_SKILLS_SYNC_TOKEN || github.token }}
          add-paths: packages/powersync/skills
          branch: sync/agent-skills
          delete-branch: true
          commit-message: Sync agent skill from agent-skills ${{ steps.synced.outputs.tag }}
          title: Sync agent skill from agent-skills ${{ steps.synced.outputs.tag }}
          body: |
            Updates the vendored `powersync-sdk` agent skill to
            [powersync-ja/agent-skills ${{ steps.synced.outputs.tag }}](https://github.com/powersync-ja/agent-skills/releases/tag/${{ steps.synced.outputs.tag }}).

            Generated by `tool/sync_skills.sh` via the `Sync agent skills` workflow.
            Remember to add a changelog entry before releasing.
