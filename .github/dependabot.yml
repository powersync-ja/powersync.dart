version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  # Dependabot uses the npm ecosystem for pnpm projects (detected via pnpm-lock.yaml).
  - package-ecosystem: "npm"
    directories:
      - "/packages/diagnostics-integration"
      - "/packages/js-assets"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns:
          - "*"
